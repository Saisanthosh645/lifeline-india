[alembic]
script_location = alembic
# sqlalchemy.url is overridden at runtime by env.py using settings.database_url
# Keep this default for offline generation
sqlalchemy.url = postgresql+asyncpg://lifeline:lifeline@localhost:5432/lifeline

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
